  <style>
    /* =========================================================
       1. DESIGN TOKENS — edit these values to change the theme
       ========================================================= */
    :root {
      --ivory: #F8F6F1;
      --charcoal: #252521;
      --champagne: #B49A76;
      --sage: #DDE3DA;
      --muted: #77766F;
      --border: #E4E0D8;
      --white: #FFFFFF;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: "DM Sans", Arial, sans-serif;
      --container: 1180px;
      --gutter: clamp(20px, 5vw, 76px);
      --section-space: clamp(76px, 10vw, 142px);
      --ease: cubic-bezier(.22, .61, .36, 1);
      --duration: 650ms;
      --shadow: 0 22px 70px rgba(37, 37, 33, .10);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body.menu-open { overflow: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    ::selection { background: var(--sage); color: var(--charcoal); }
    :focus-visible { outline: 3px solid var(--champagne); outline-offset: 4px; }
    .container { width: min(var(--container), calc(100% - var(--gutter) * 2)); margin-inline: auto; }
    .section { padding-block: var(--section-space); }
    .section--compact { padding-block: clamp(54px, 7vw, 88px); }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      margin: 0 0 18px; color: var(--muted); font-size: .72rem;
      font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--champagne); }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.12; letter-spacing: -.035em; }
    h1 { font-size: clamp(2.6rem, 5.5vw, 5.65rem); }
    h2 { font-size: clamp(2.2rem, 4vw, 4.1rem); }
    h3 { font-size: clamp(1.35rem, 2vw, 1.8rem); }
    p { color: var(--muted); }
    .section-heading { max-width: 760px; margin-bottom: clamp(32px, 5vw, 60px); }
    .section-heading h2 { margin-bottom: 18px; }
    .section-heading p { max-width: 620px; margin-bottom: 0; }
    .accent { color: var(--champagne); }
    .fine-rule { width: 72px; height: 2px; margin: 26px 0; background: var(--champagne); transform-origin: left; }
    .text-link {
      display: inline-flex; align-items: center; gap: 12px; font-size: .88rem;
      font-weight: 700; letter-spacing: .01em; padding: 8px 0;
    }
    .text-link .arrow { display: inline-block; transition: transform 250ms var(--ease); }
    .text-link:hover .arrow { transform: translate(4px, -2px); }
    .button {
      display: inline-flex; justify-content: center; align-items: center; gap: 22px;
      min-height: 54px; padding: 14px 22px; border: 1px solid var(--charcoal);
      background: var(--charcoal); color: var(--white); font-size: .84rem;
      font-weight: 700; letter-spacing: .02em; transition: background 250ms var(--ease),
      color 250ms var(--ease), border-color 250ms var(--ease), transform 250ms var(--ease);
    }
    .button .arrow { transition: transform 250ms var(--ease); font-size: 1.1rem; }
    .button:hover { background: transparent; color: var(--charcoal); transform: translateY(-2px); }
    .button:hover .arrow { transform: translateX(4px); }
    .button--light { background: var(--ivory); color: var(--charcoal); border-color: var(--ivory); }
    .button--light:hover { background: transparent; color: var(--ivory); border-color: rgba(255,255,255,.55); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* =========================================================
       2. HEADER & NAVIGATION
       ========================================================= */
    .site-header {
      position: sticky; top: 0; z-index: 1000; background: rgba(248,246,241,.94);
      border-bottom: 1px solid transparent; backdrop-filter: blur(16px);
      transition: border-color 250ms ease, box-shadow 250ms ease, background 250ms ease;
    }
    .site-header.is-scrolled { border-color: var(--border); box-shadow: 0 8px 28px rgba(37,37,33,.045); }
    .header-inner { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { display: inline-flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
    .brand-name { font-family: var(--serif); font-size: 1.48rem; letter-spacing: .015em; line-height: 1.1; }
    .brand-tag { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .15em; }
    .desktop-nav { display: flex; align-items: center; gap: clamp(15px, 2vw, 29px); margin-left: auto; }
    .nav-link { position: relative; padding: 10px 0; font-size: .76rem; color: #5f5d56; white-space: nowrap; }
    .nav-link::after { position: absolute; content: ""; left: 0; right: 100%; bottom: 4px; height: 1px; background: var(--champagne); transition: right 250ms var(--ease); }
    .nav-link:hover::after, .nav-link[aria-current="page"]::after { right: 0; }
    .header-socials { display: flex; align-items: center; gap: 9px; }
    .icon-link {
      width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid transparent;
      border-radius: 50%; color: var(--charcoal); transition: background 220ms ease, border-color 220ms ease, transform 220ms ease;
    }
    .icon-link:hover { background: var(--white); border-color: var(--border); transform: translateY(-2px); }
    .icon-link svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-link .linkedin-mark { fill: currentColor; stroke: none; }
    .menu-toggle { display: none; width: 44px; height: 44px; background: transparent; border: 1px solid var(--border); cursor: pointer; }
    .menu-toggle span { display: block; width: 18px; height: 1px; background: var(--charcoal); margin: 5px auto; transition: transform 220ms ease; }

    /* =========================================================
       3. HERO
       ========================================================= */
    .hero { position: relative; overflow: clip; padding: clamp(38px, 6vw, 80px) 0 clamp(60px, 8vw, 110px); }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(320px, .84fr); gap: clamp(42px, 8vw, 112px); align-items: center; }
    .hero-copy { padding-block: 20px; position: relative; z-index: 2; }
    .hero-kicker { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .hero-kicker::before { content: ""; width: 34px; height: 1px; background: var(--champagne); }
    .hero h1 { max-width: 760px; margin-bottom: 0; }
    .hero h1 .title-line { display: block; }
    .hero h1 .title-line:last-child { color: var(--muted); font-size: .38em; letter-spacing: -.015em; line-height: 1.45; margin-top: 14px; font-family: var(--sans); font-weight: 500; }
    .hero-rule { width: 86px; height: 2px; background: var(--champagne); margin: 28px 0 24px; transform-origin: left; }
    .hero-description { max-width: 560px; font-size: clamp(1rem, 1.4vw, 1.14rem); line-height: 1.85; margin-bottom: 30px; }
    .hero-note { margin-top: 20px; font-size: .72rem; color: var(--muted); }
    .hero-visual { position: relative; width: 100%; max-width: 500px; justify-self: end; }
    .hero-image-frame { position: relative; aspect-ratio: 4 / 5; background: var(--sage); overflow: hidden; }
    .hero-image-frame::before { content: ""; position: absolute; inset: 16px -16px -16px 16px; border: 1px solid rgba(180,154,118,.65); z-index: -1; }
    .hero-image-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
    .image-placeholder {
      position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px;
      background: linear-gradient(145deg, #e7e7dd, #cbd3c8); color: #4d5148;
    }
    .image-placeholder strong { font-family: var(--serif); font-size: clamp(1.7rem, 3vw, 2.5rem); font-weight: 500; }
    .image-placeholder span { margin-top: 8px; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
    .hero-caption { display: flex; justify-content: space-between; gap: 12px; padding-top: 17px; color: var(--muted); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; }
    .hero-side-note { position: absolute; right: -34px; top: 28px; writing-mode: vertical-rl; font-size: .64rem; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }

    /* =========================================================
       13. CONTACT & FOOTER
       ========================================================= */
    .contact-section { background: var(--charcoal); color: var(--ivory); }
    .contact-grid { display: grid; grid-template-columns: 1fr .72fr; gap: clamp(38px, 8vw, 110px); align-items: end; }
    .contact-section .eyebrow, .contact-section p { color: #c6c3b9; }
    .contact-section h2 { max-width: 750px; margin-bottom: 24px; }
    .contact-links { border-top: 1px solid rgba(255,255,255,.2); }
    .contact-link { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 17px 0; border-bottom: 1px solid rgba(255,255,255,.2); color: var(--ivory); font-size: .88rem; }
    .contact-link span:last-child { color: var(--champagne); transition: transform 250ms ease; }
    .contact-link:hover span:last-child { transform: translate(4px, -3px); }
    .site-footer { background: #1c1c19; color: var(--ivory); padding: 28px 0; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .footer-brand { font-family: var(--serif); font-size: 1.1rem; }
    .footer-copy, .footer-links { color: #b7b5ac; font-size: .72rem; }
    .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .footer-links a:hover { color: var(--ivory); }

    /* =========================================================
       14. SCROLL REVEAL — content is visible by default
       JS adds .motion-ready only after initialization succeeds.
       ========================================================= */
    .motion-ready .reveal { opacity: 0; transform: translateY(20px); transition: opacity var(--duration) var(--ease), transform var(--duration) var(--ease); }
    .motion-ready .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .motion-ready .reveal--image { transform: translateY(12px) scale(.99); }
    .motion-ready .reveal--image.is-visible { transform: translateY(0) scale(1); }
    .reveal-delay-1 { transition-delay: 80ms !important; }
    .reveal-delay-2 { transition-delay: 160ms !important; }
    .reveal-delay-3 { transition-delay: 240ms !important; }
    .hero-copy > * { animation: hero-enter 700ms var(--ease) both; }
    .hero-copy > *:nth-child(2) { animation-delay: 90ms; }
    .hero-copy > *:nth-child(3) { animation-delay: 150ms; }
    .hero-copy > *:nth-child(4) { animation-delay: 220ms; }
    .hero-copy > *:nth-child(5) { animation-delay: 280ms; }
    .hero-visual { animation: hero-enter 850ms var(--ease) 120ms both; }
    @keyframes hero-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================================
       15. RESPONSIVE LAYOUTS
       ========================================================= */
    @media (max-width: 1100px) {
      .desktop-nav { gap: 15px; }
      .nav-link { font-size: .71rem; }
      .header-inner { gap: 18px; }
      .header-socials { gap: 3px; }
      .hero-grid { gap: 48px; }
      .hero-side-note { right: -25px; }
    }

      .hero-side-note { display: none; }
      .about-grid { gap: 44px; }

      .qualification { display: grid; grid-template-columns: 90px 1fr; column-gap: 24px; padding: 28px 0; }
      .qualification + .qualification { border-left: 0; border-top: 1px solid var(--border); }

      body { font-size: 15px; }

      .hero { padding-top: 30px; padding-bottom: 60px; }
      .hero-grid { grid-template-columns: 1fr; gap: 32px; }
      .hero-copy { padding-block: 0; }
      .hero-kicker { margin-bottom: 19px; font-size: .64rem; }
      .hero h1 { font-size: clamp(2.45rem, 11vw, 3.8rem); line-height: 1.04; }
      .hero h1 .title-line:last-child { font-size: .43em; line-height: 1.5; margin-top: 12px; max-width: 350px; }
      .hero-rule { margin: 22px 0 17px; }

/* =========================================================
   MOBILE MENU: Apple-style glass panel + animation
   ========================================================= */
.nav-socials { display: none; }

@media (max-width: 900px) {
  /* Glass goes on a pseudo-element, because backdrop-filter directly on the
     header would break the position: fixed menu. */
  .site-header {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .site-header::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: rgba(248,246,241,.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }

  .header-socials { display: none; }
  .menu-toggle { margin-left: auto; }

  /* Menu icon turns into an X */
  .menu-toggle span { transition: transform 300ms var(--ease); }
  .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] span:last-child { transform: translateY(-3px) rotate(-45deg); }

  /* Floating glass card instead of a full-screen overlay */
  .desktop-nav {
    display: flex;
    position: fixed;
    top: 82px;
    left: 14px;
    right: 14px;
    bottom: auto;
    max-height: calc(100vh - 100px);
    max-height: calc(100dvh - 100px);
    padding: 10px 24px 22px;
    margin: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 26px;
    background: rgba(248,246,241,.58);
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    box-shadow: 0 24px 60px rgba(37,37,33,.18), inset 0 1px 0 rgba(255,255,255,.8);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-14px) scale(.97);
    transform-origin: top right;
    transition: opacity 320ms var(--ease), transform 420ms var(--ease), visibility 0s linear 420ms;
  }
  .desktop-nav.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition: opacity 320ms var(--ease), transform 420ms var(--ease), visibility 0s;
  }

  /* Links slide in one by one */
  .nav-link {
    border-bottom: 1px solid rgba(37,37,33,.08);
    font-size: 1.5rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 400ms var(--ease), transform 400ms var(--ease);
  }

    const SITE_CONFIG = {

    const menuToggle = document.getElementById("menuToggle");
    const primaryNav = document.getElementById("primaryNav");

    function closeMobileMenu() {
      if (!menuToggle || !primaryNav) return;
      primaryNav.classList.remove("is-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Open navigation menu");
      document.body.classList.remove("menu-open");
    }

    if (menuToggle && primaryNav) {
      menuToggle.addEventListener("click", () => {
        const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", String(!isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "Open navigation menu" : "Close navigation menu");
        primaryNav.classList.toggle("is-open", !isOpen);
        document.body.classList.toggle("menu-open", !isOpen);
      });

      primaryNav.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMobileMenu);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMobileMenu();
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > SITE_CONFIG.mobileBreakpoint) closeMobileMenu();
      });
    }



    /* Copy the social icons into the mobile menu (shown only on mobile via CSS) */
const headerSocials = document.querySelector(".header-socials");
if (headerSocials && primaryNav) {

  primaryNav.appendChild(navSocials);
}

    /* =========================================================
       3. HEADER SCROLL STATE
       ========================================================= */
    const siteHeader = document.getElementById("siteHeader");

    function updateHeaderState() {
      if (!siteHeader) return;
      siteHeader.classList.toggle("is-scrolled", window.scrollY > SITE_CONFIG.headerScrollThreshold);
    }

    updateHeaderState();
    window.addEventListener("scroll", updateHeaderState, { passive: true });

    /* =========================================================
       4. SCROLL REVEALS
       Content is visible by default. Only enable hidden/reveal
       styling after IntersectionObserver has been confirmed.
       ========================================================= */
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const revealElements = document.querySelectorAll(".reveal");

    if (!prefersReducedMotion && "IntersectionObserver" in window && revealElements.length) {
      try {
        const revealObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.12,
          rootMargin: "0px 0px -35px 0px"
        });

        /* Enable reveal styling only after the observer is ready. */
        document.documentElement.classList.add("motion-ready");
        revealElements.forEach((element) => revealObserver.observe(element));
      } catch (error) {
        /* Fail safely: content remains visible if reveal setup fails. */
        document.documentElement.classList.remove("motion-ready");
      }
    }

    /* =========================================================
       5. FOOTER YEAR
       ========================================================= */
    const copyrightYear = document.getElementById("copyrightYear");
    if (copyrightYear) copyrightYear.textContent = new Date().getFullYear();
