<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F6F1">

  <!-- EDIT HERE: page title + description -->
  <title>Page Title | Sandali Ashara</title>
  <meta name="description" content="Page description.">
  <link rel="icon" type="image/png" href="https://imag.sandaliashara.com/asset/SA_iconfavilcon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. TOKENS & BASE
       ========================================================= */
    :root {
      --ivory: #F8F6F1;
      --charcoal: #252521;
      --champagne: #B49A76;
      --sage: #DDE3DA;
      --muted: #77766F;
      --border: #E4E0D8;
      --white: #FFFFFF;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: "DM Sans", Arial, sans-serif;
      --container: 1180px;
      --gutter: clamp(20px, 5vw, 76px);
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    @media (max-width: 620px) { :root { --gutter: 22px; } }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;       /* keeps the footer at the bottom on an empty page */
      background: var(--ivory);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    @media (max-width: 620px) { body { font-size: 15px; } }
    body.menu-open { overflow: hidden; }
    main { flex: 1; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    ::selection { background: var(--sage); color: var(--charcoal); }
    :focus-visible { outline: 3px solid var(--champagne); outline-offset: 4px; }
    p, h1, h2, h3 { margin-top: 0; }
    p { color: var(--muted); }

    .container {
      width: min(var(--container), calc(100% - var(--gutter) * 2));
      margin-inline: auto;
    }

    /* =========================================================
       2. HEADER — shared (all screen sizes)
       The "glass" lives on ::before so the header itself stays
       simple and the position:fixed mobile menu keeps working.
       ========================================================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: transparent;
      transition: top 450ms var(--ease);
    }
    .site-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(248,246,241,.94);
      border: 1px solid transparent;
      border-radius: 0;
      transition:
        left 450ms var(--ease), right 450ms var(--ease),
        top 450ms var(--ease), bottom 450ms var(--ease),
        border-radius 450ms var(--ease), background 450ms var(--ease),
        border-color 450ms var(--ease), box-shadow 450ms var(--ease);
    }
    .site-header.is-scrolled::before {
      bottom: -2px;
      background: rgba(248,246,241,.58);
      border-color: rgba(255,255,255,.7);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
    }

    .header-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      transition: padding 450ms var(--ease);
    }

    /* ---------- Brand ---------- */
    .brand { display: inline-flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
    .brand-name { font-family: var(--serif); font-size: 1.48rem; letter-spacing: .015em; line-height: 1.1; }
    .brand-tag { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .15em; }

    /* ---------- Navigation links ---------- */
    .site-nav { display: flex; align-items: center; margin-left: auto; }
    .nav-link { position: relative; padding: 10px 0; color: #5f5d56; white-space: nowrap; }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 0; right: 100%; bottom: 4px;
      height: 1px;
      background: var(--champagne);
      transition: right 250ms var(--ease);
    }
    .nav-link:hover::after,
    .nav-link[aria-current="page"]::after { right: 0; }

    /* ---------- Social icons ---------- */
    .header-socials { display: flex; align-items: center; margin-left: 18px; }
    .icon-link {
      width: 30px; height: 30px;
      display: inline-grid; place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      color: var(--charcoal);
      transition: background 220ms ease, border-color 220ms ease, color 220ms ease, transform 220ms ease;
    }
    .icon-link svg { width: 15px; height: 15px; fill: currentColor; }
    .icon-link:hover { background: var(--white); border-color: var(--border); color: var(--champagne); transform: translateY(-2px); }

    /* ---------- Mobile menu button + cloned socials (hidden on desktop) ---------- */
    .menu-toggle {
      display: none;
      width: 44px; height: 44px;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .menu-toggle span { display: block; width: 18px; height: 1px; background: var(--charcoal); margin: 5px auto; }
    .nav-socials { display: none; }

    /* =========================================================
       3. HEADER — DESKTOP (901px and up)
       ========================================================= */
    @media (min-width: 901px) {
      .site-nav { gap: clamp(18px, 2.4vw, 34px); }
      .nav-link { font-size: .92rem; }

      .site-header::before {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .header-inner { padding-inline: 14px; }

      /* Floating glass pill after scrolling */
      .site-header.is-scrolled { top: 12px; }
      .site-header.is-scrolled::before {
        left: max(16px, calc((100% - 1240px) / 2));
        right: max(16px, calc((100% - 1240px) / 2));
        border-radius: 999px;
        box-shadow: 0 18px 50px rgba(37,37,33,.14), inset 0 1px 0 rgba(255,255,255,.85);
      }
      .site-header.is-scrolled .header-inner {
        padding-inline: 34px;
        animation: header-pop 520ms var(--ease);
      }
    }
    @media (min-width: 901px) and (max-width: 1100px) {
      .header-inner { gap: 18px; }
      .site-nav { gap: 15px; }
      .header-socials { gap: 3px; }
    }

    @keyframes header-pop {
      from { transform: translateY(-8px) scale(.985); opacity: .6; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* =========================================================
       4. HEADER — MOBILE / TABLET (900px and down)
       ========================================================= */
    @media (max-width: 900px) {
      .header-inner { min-height: 74px; padding-inline: 4px; }
      .header-socials { display: none; }

      .site-header::before {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
      }

      /* Floating glass bar after scrolling */
      .site-header.is-scrolled { top: 10px; }
      .site-header.is-scrolled::before {
        left: 12px;
        right: 12px;
        border-radius: 14px;
        box-shadow: 0 14px 40px rgba(37,37,33,.14), inset 0 1px 0 rgba(255,255,255,.85);
      }
      .site-header.is-scrolled .header-inner {
        padding-inline: 18px;
        animation: header-pop 520ms var(--ease);
      }

      /* Menu button: turns into an X */
      .menu-toggle { display: block; margin-left: auto; }
      .menu-toggle span { transition: transform 300ms var(--ease); }
      .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
      .menu-toggle[aria-expanded="true"] span:last-child  { transform: translateY(-3px) rotate(-45deg); }

      /* Menu: floating glass card under the header */
      .site-nav {
        position: fixed;
        top: 84px;
        left: 14px;
        right: 14px;
        max-height: calc(100vh - 104px);
        max-height: calc(100dvh - 104px);
        margin: 0;
        padding: 10px 24px 22px;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        overflow-y: auto;
        border: 1px solid rgba(255,255,255,.65);
        border-radius: 26px;
        background: rgba(248,246,241,.58);
        backdrop-filter: blur(30px) saturate(190%);
        -webkit-backdrop-filter: blur(30px) saturate(190%);
        box-shadow: 0 24px 60px rgba(37,37,33,.18), inset 0 1px 0 rgba(255,255,255,.8);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-14px) scale(.97);
        transform-origin: top right;
        transition: opacity 320ms var(--ease), transform 420ms var(--ease), visibility 0s linear 420ms;
      }
      .site-header.is-scrolled .site-nav {
        top: 98px;
        max-height: calc(100vh - 118px);
        max-height: calc(100dvh - 118px);
      }
      .site-nav.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
        transition: opacity 320ms var(--ease), transform 420ms var(--ease), visibility 0s;
      }

      /* Links slide in one by one */
      .nav-link {
        padding: 15px 0;
        font-size: 1rem;
        text-align: center;
        border-bottom: 1px solid rgba(37,37,33,.08);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 400ms var(--ease), transform 400ms var(--ease);
      }
      .nav-link::after { display: none; }
      .site-nav.is-open .nav-link { opacity: 1; transform: none; }
      .site-nav.is-open .nav-link:nth-child(1) { transition-delay: 80ms; }
      .site-nav.is-open .nav-link:nth-child(2) { transition-delay: 130ms; }
      .site-nav.is-open .nav-link:nth-child(3) { transition-delay: 180ms; }
      .site-nav.is-open .nav-link:nth-child(4) { transition-delay: 230ms; }

      /* Social icons at the bottom of the menu */
      .nav-socials {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding-top: 20px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 400ms var(--ease), transform 400ms var(--ease);
      }
      .site-nav.is-open .nav-socials { opacity: 1; transform: none; transition-delay: 340ms; }
      .nav-socials .icon-link { background: rgba(255,255,255,.55); border-color: rgba(255,255,255,.8); }
    }

    @media (max-width: 620px) {
      .header-inner { min-height: 68px; gap: 10px; }
      .brand-name { font-size: 1.1rem; }
      .brand-tag { font-size: .5rem; }
      .menu-toggle { width: 39px; height: 39px; flex-shrink: 0; }
      .site-nav { top: 78px; max-height: calc(100vh - 98px); max-height: calc(100dvh - 98px); }
      .site-header.is-scrolled .site-nav { top: 92px; max-height: calc(100vh - 112px); max-height: calc(100dvh - 112px); }
    }
    @media (max-width: 360px) {
      .brand-name { font-size: 1rem; }
      .header-socials .icon-link:first-child { display: none; }
    }

    /* =========================================================
       5. FOOTER
       ========================================================= */
    .site-footer { background: #1c1c19; color: var(--ivory); padding: 28px 0; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .footer-brand { font-family: var(--serif); font-size: 1.1rem; }
    .footer-copy, .footer-links { color: #b7b5ac; font-size: .72rem; }
    .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .footer-links a:hover { color: var(--ivory); }
    @media (max-width: 620px) {
      .footer-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
      .footer-links { gap: 14px; }
    }

    /* =========================================================
       6. REDUCED MOTION
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       FOOTER
       ======================================================= -->

      <a class="footer-brand" href="index.html#home">Sandali Ashara</a>
      <span class="footer-copy">© <span id="copyrightYear">2026</span> Sandali Ashara. All rights reserved.</span>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="index.html#about">About</a>
        <a href="index.html#qualifications">Qualifications</a>
        <a href="index.html#publications">Publications</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>

  <script>
    (function () {
      const MOBILE_BREAKPOINT = 900;   // px — matches the CSS
      const SCROLL_THRESHOLD = 12;     // px — when the floating header appears

      const header = document.getElementById("siteHeader");
      const nav = document.getElementById("primaryNav");
      const toggle = document.getElementById("menuToggle");
      const socials = document.querySelector(".header-socials");

      /* ---------- Copy social icons into the mobile menu ---------- */
      if (socials && nav) {
        const navSocials = socials.cloneNode(true);
        navSocials.className = "nav-socials";
        navSocials.removeAttribute("aria-label");
        nav.appendChild(navSocials);
      }

      /* ---------- Mobile menu open / close ---------- */
      function setMenu(open) {
        nav.classList.toggle("is-open", open);
        document.body.classList.toggle("menu-open", open);
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
      }

      if (toggle && nav) {
        toggle.addEventListener("click", () => {
          setMenu(toggle.getAttribute("aria-expanded") !== "true");
        });
        nav.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => setMenu(false));
        });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });
        window.addEventListener("resize", () => {
          if (window.innerWidth > MOBILE_BREAKPOINT) setMenu(false);
        });
      }

      /* ---------- Floating header on scroll ---------- */
      function updateHeader() {
        if (header) header.classList.toggle("is-scrolled", window.scrollY > SCROLL_THRESHOLD);
      }
      updateHeader();
      window.addEventListener("scroll", updateHeader, { passive: true });

      /* ---------- Footer year ---------- */
      const year = document.getElementById("copyrightYear");
      if (year) year.textContent = new Date().getFullYear();
    })();
  </script>
